<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta AR - Orlando Javier Rodriguez Roque</title>
  <link rel="stylesheet" href="style.css">
  <!-- Librerías A-Frame y AR.js -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body>

  <!-- Interfaz flotante -->
  <div id="ui-overlay">
    <p id="status-text">Apunta la cámara al marcador Hiro de la tarjeta</p>
    <a id="portfolio-btn" href="https://github.com/" target="_blank" class="hidden">
      Ver Portafolio / LinkedIn
    </a>
  </div>

  <!-- Escena de Realidad Aumentada -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <!-- Usa preset="hiro" para probar rápido. Si generas tu propio marcador .patt, cámbialo por:
         <a-marker id="marcador-principal" type="pattern" url="marcador.patt"> -->
    <a-marker id="marcador-principal" preset="hiro">
      
      <!-- Fondo semitransparente para leer bien el texto -->
      <a-plane position="0 0.01 0" rotation="-90 0 0" width="2.3" height="1.4" color="#0f172a" opacity="0.92"></a-plane>

      <!-- Tu foto (renombra tu foto a foto.jpg y súbela a la misma carpeta en GitHub) -->
      <a-image src="foto.jpg" position="-0.7 0.05 0" rotation="-90 0 0" width="0.7" height="0.7"></a-image>

      <!-- Tus datos en texto -->
      <a-text value="Orlando Javier Rodriguez Roque" position="-0.22 0.05 -0.35" rotation="-90 0 0" color="#38bdf8" width="1.9" font="dejavu"></a-text>
      <a-text value="Futuro Ing. Informatico" position="-0.22 0.05 -0.15" rotation="-90 0 0" color="#e2e8f0" width="1.6" font="dejavu"></a-text>
      <a-text value="Tel: +52 4924936755" position="-0.22 0.05 0.05" rotation="-90 0 0" color="#94a3b8" width="1.5"></a-text>
      <a-text value="20202270@uaz.edu.mx" position="-0.22 0.05 0.25" rotation="-90 0 0" color="#94a3b8" width="1.4"></a-text>
      <a-text value="linkedin.com/in/orlando-rodriguez" position="-0.22 0.05 0.45" rotation="-90 0 0" color="#22c55e" width="1.4"></a-text>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script src="script.js"></script>
</body>
</html>
